[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-dispatcher"
version = "0.1.0"
description = "Local coding agent dispatcher: supervised worker delegation for Claude Code (PRD: local-agent-dispatcher-prd.md)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.29,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
local-dispatcher = "local_dispatcher.__main__:main"
ladd = "local_dispatcher.cli:main"
dispatcher-mcp = "local_dispatcher.mcp_adapter:main"

[tool.setuptools.packages.find]
include = ["local_dispatcher*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
